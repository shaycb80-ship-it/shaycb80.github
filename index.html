<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shay Withnall | Business Development & Bid Writing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Shay Withnall – Business Development and Bid Writing professional with extensive third sector experience, strategic leadership and proven fundraising success.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0f172a;
      --bg2: #111827;
      --accent: #38bdf8;
      --text: #f9fafb;
      --muted: #9ca3af;
      --border: #1f2937;
    }

    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: radial-gradient(circle at top, #111827 0%, #020617 60%);
      color: var(--text);
      line-height: 1.7;
    }

    a { color: inherit; text-decoration: none; }

    .page {
      max-width: 1100px;
      margin: auto;
      padding: 28px 16px 80px;
    }

    /* HERO HEADER */
    header {
      background: linear-gradient(135deg, rgba(2,6,23,0.92), rgba(11,17,32,0.92)),
        url('https://images.unsplash.com/photo-1521790361543-f645cf042ec4?auto=format&fit=crop&w=1200&q=80');
      background-size: cover;
      background-position: center;
      padding: 50px 32px;
      border-radius: 24px;
      border: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 32px;
    }

    .pill {
      display: inline-block;
      padding: 6px 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--muted);
    }

    .name {
      font-size: 2.4rem;
      font-weight: 700;
      margin-top: 10px;
    }

    .title {
      color: var(--accent);
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      margin-top: 4px;
    }

    .summary {
      margin-top: 16px;
      max-width: 600px;
      color: var(--muted);
      font-size: 1rem;
    }

    .btn-row {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 500;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--accent);
      color: #02101a;
      box-shadow: 0 10px 30px rgba(56,189,248,0.35);
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
